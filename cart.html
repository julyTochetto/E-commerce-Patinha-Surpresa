<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="src/css/styles.css" />
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://unpkg.com/scrollreveal"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Produtos</title>
</head>

<body>
    <header>
            <nav id="navbar">
                <i class="fa-solid fa-paw"></i>
                <ul id="nav-list">
                    <li class="nav-item active">
                        <a href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a href="menu.html">Surpresa</a>
                    </li>
                    <li class="nav-item">
                        <a href="pack.html">Pacote</a>
                    </li>
                </ul>
                <div class="shopping btn-default btn-pc">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="quantity">0</span>
                </div>
                <button id="mobile-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div id="mobile-menu">
                    <ul id="mobile-nav-list">
                        <li class="nav-item ">
                            <a href="index.html">Início</a>
                        </li>
                        <li class="nav-item">
                            <a href="menu.html">Surpresa</a>
                        </li>
                        <li class="nav-item">
                            <a href="pack.html">Pacote</a>
                        </li>
                    </ul>
                    <div class="shopping btn-default">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span class="quantity">0</span>
                    </div>
                </div>
            </nav>
        </header>
    <div class="container">
        <div class="filter">
            <input class="searchInput" placeholder="Buscar...">
            <div class="pet-filter">
                <button class="filter-btn active" data-filter="todos">Todos</button>
                <button class="filter-btn" data-filter="cao">Cães</button>
                <button class="filter-btn" data-filter="gato">Gatos</button>
            </div>
            <div class="price-filter">
                <select id="price">
                    <option value="default">Ordenar por</option>
                    <option value="min">Menor Preço</option>
                    <option value="max">Maior Preço</option>
                </select>
            </div>
        </div>
        <div class="list"></div>
    </div>
    <div class="card">
        <h1>Carrinho
            <i class="fa-solid fa-bone"></i>
        </h1>
        <ul class="list-card"></ul>
        <div class="check-out">
            <div class="total">0</div>
            <div class="close-shopping">Fechar</div>
        </div>
    </div>
    <footer>
        <div class="footer">
            <div id="footer-items">
                <span id="copyright">
                    &copy 2025
                </span>
                <div class="social-media-buttons">
                    <a href="">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>
                    <a href="">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="">
                        <i class="fa-brands fa-facebook"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="src/javascript/script.js"></script>
    <script src="src/javascript/cart.js"></script>
</body>

</html>
