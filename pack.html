            </div>
        </nav>
    </header>
    <main id="form-container">
        <div id="form-header">
            <h1 id="form-title">Assinatura Mensal</h1>
        </div>
        <form id="form">
            <div id="input-container">
                <div class="input-box">
                    <label for="name" class="form-label">Nome</label>
                    <div class="input-field">
                        <input type="text" name="name" id="name" class="form-control" required>
                    </div>
                </div>
                <div class="input-box">
                    <label for="last-name" class="form-label">Sobrenome</label>
                    <div class="input-field">
                        <input type="text" name="last-name" id="last-name" class="form-control" required>
                    </div>
                </div>
                <div class="input-box">
                    <label for="birthdate" class="form-label">Data de Nascimento</label>
                    <div class="input-field">
                        <input type="date" name="birthdate" id="birthdate" class="form-control" required>
                    </div>
                </div>
                <div class="input-box">
                    <label for="email" class="form-label">E-mail</label>
                    <div class="input-field">
                        <input type="email" name="email" id="email" class="form-control" required>
                    </div>
                </div>
                <div class="input-box">
                    <label for="adress" class="form-label">Endereço</label>
                    <div class="input-field">
                        <input type="text" name="adress" id="adress" class="form-control" required>
                    </div>
                </div>
                <div class="input-box">
                    <label for="cep" class="form-label">CEP</label>
                    <div class="input-field">
                        <input type="number" name="cep" id="cep" class="form-control" required>
                    </div>
                </div>
                <div class="radio-container">
                    <label class="form-label">Idade do Pet</label>
                    <div id="age-inputs" >
                        <div class="radio-box">
                            <input type="radio" name="age" id="filhote" class="form-control" value="filhote" checked>
                            <label for="age" class="form-label">Filhote</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" name="age" id="adulto" class="form-control" value="adulto">
                            <label for="age" class="form-label">Adulto</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" name="age" id="idoso" class="form-control" value="idoso">
                            <label for="age" class="form-label">Idoso</label>
                        </div>
                    </div>
                    <label class="form-label">Raça</label><div id="age-inputs">
                        <div id="raca-inputs">
                            <div class="radio-box">
                                <input type="radio" name="raca" id="dog" class="form-control" value="dog" checked>
                                <label for="raca" class="form-label">Canino</label>
                            </div>
                            <div class="radio-box">
                                <input type="radio" name="raca" id="cat" class="form-control" value="cat">
                                <label for="raca" class="form-label">Felino</label>
                            </div>
                        </div>
                </div>
            </div>
            <button  type="submit" class="btn-default">
                <i class="fa-solid fa-check"></i>
                Confirmar Assinatura
            </button>
        </form>
    </main>
